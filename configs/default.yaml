# Default configuration for MLX LoRA fine-tuning

# Model configuration
model:
  name: "Qwen/Qwen3-0.6B"  # Base model from Hugging Face
  tokenizer: null  # Use model's tokenizer if null
  max_seq_length: 2048

# LoRA configuration
lora:
  rank: 8                    # LoRA rank (r)
  alpha: 16                  # LoRA alpha for scaling
  dropout: 0.05              # Dropout probability
  target_modules:            # Layers to apply LoRA
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Training configuration
training:
  learning_rate: 1.0e-4
  batch_size: 4
  num_epochs: 3
  gradient_accumulation_steps: 1
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  
  # Checkpointing
  save_steps: 500
  save_total_limit: 3
  
  # Logging
  logging_steps: 10
  eval_steps: 100

# GRPO configuration
grpo:
  group_size: 4
  clip_epsilon: 0.2
  beta_kl: 0.02
  advantage_epsilon: 1.0e-8
  max_generation_tokens: 128
  temperature: 0.8
  top_p: 1.0
  warmup_epochs: 1
  preflight_sample_size: 128
  min_reward_std: 1.0e-6
  eval_steps: 50
  logging_steps: 10

# Reward function configuration for GRPO
reward:
  function: "weighted_rules"
  weights:
    exact_match: 0.4
    keyword_coverage: 0.3
    json_format: 0.2
    length_band: 0.1
  pass_threshold: 0.6
  metadata_keyword_field: "keywords"
  min_response_length: 16
  max_response_length: 512
  require_nonzero_variance: true

# Data configuration
data:
  train_file: "data/processed/train.jsonl"
  valid_file: "data/processed/valid.jsonl"
  rl_train_file: "data/processed/rl_train.jsonl"
  rl_valid_file: "data/processed/rl_valid.jsonl"
  rl_eval_file: "data/processed/rl_eval.jsonl"
  prompt_template: |
    <|begin_of_text|><|start_header_id|>user<|end_header_id|>
    {instruction}<|eot_id|><|start_header_id|>assistant<|end_header_id|>
    {response}<|eot_id|>
  training_method: "basic"
  kfold_splits: 5
  kfold_seed: 42

# Output configuration
output:
  dir: "outputs"
  adapters_dir: "outputs/adapters"
  checkpoints_dir: "outputs/checkpoints"
  logs_dir: "outputs/logs"

# Hugging Face configuration
huggingface:
  push_to_hub: false
  repo_id: null              # Set via HF_REPO_ID env var
  private: true
