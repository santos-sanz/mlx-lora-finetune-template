name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          grep -v '^mlx' requirements.txt > /tmp/ci-requirements.txt
          pip install -r /tmp/ci-requirements.txt

      - name: Compile sources
        run: |
          python -m compileall -q src app.py scripts tests

      - name: Run tests
        run: |
          pytest -q
